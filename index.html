<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Agent 学习平台 —— 系统化学习 AI Agent 的基础概念、核心原理、架构设计与实战案例。" />
  <meta name="theme-color" content="#5b5bd6" />
  <title>Agent 学习平台 · 从入门到进阶</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/reader.css" />
</head>
<body>
  <!-- 阅读进度条 -->
  <div class="reading-progress" id="readingProgress" aria-hidden="true"><span></span></div>

  <!-- 顶部栏 -->
  <header class="topbar" id="topbar">
    <button class="icon-btn only-mobile" id="menuToggle" aria-label="打开目录" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>

    <a class="brand" href="#/" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <rect x="4" y="7" width="16" height="12" rx="3.5" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="9.5" cy="13" r="1.4" fill="currentColor"/><circle cx="14.5" cy="13" r="1.4" fill="currentColor"/>
          <path d="M12 7V4M9 4h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text"><b>Agent</b> 学习平台</span>
    </a>

    <button class="search-trigger" id="searchTrigger" aria-label="搜索知识点">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="search-trigger-text">搜索知识点…</span>
      <kbd class="search-kbd">Ctrl K</kbd>
    </button>

    <div class="topbar-actions">
      <button class="version-pill" id="changelogToggle" type="button" aria-label="查看更新日志" title="查看更新日志">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><path d="M12 7.5V12l3 1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.6v1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="vp-text" id="versionText">v1.0.0</span>
        <i class="vp-dot" id="versionDot" hidden aria-hidden="true"></i>
      </button>

      <button class="icon-btn" id="notesToggle" aria-label="我的笔记与书签" title="我的笔记与书签">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none"><path d="M6 4h9l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.5 4v5.5H20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 14h6M9 17.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="badge-count" id="notesBadge" hidden>0</span>
      </button>

      <button class="icon-btn" id="readerBtn" aria-label="阅读设置" title="阅读设置（字号 / 行距 / 版心）" aria-expanded="false">
        <span class="reader-icon" aria-hidden="true">Aa</span>
      </button>

      <button class="icon-btn" id="themeToggle" aria-label="切换深色模式" title="切换浅色 / 深色模式">
        <svg class="ico-sun" viewBox="0 0 24 24" width="19" height="19" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="19" height="19" fill="none"><path d="M20 13.6A8.2 8.2 0 0 1 10.4 4 8.2 8.2 0 1 0 20 13.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout" id="layout">
    <!-- 侧边章节导航 -->
    <aside class="sidebar" id="sidebar" aria-label="课程目录">
      <div class="sidebar-inner">
        <div class="path-switch" id="pathSwitch" role="tablist" aria-label="阅读路径"></div>
        <div class="sidebar-progress" id="sidebarProgress"></div>
        <nav class="chapter-nav" id="chapterNav" aria-label="章节列表"></nav>
        <div class="sidebar-foot">
          <span class="dot-legend"><i class="dot dot-none"></i>未读</span>
          <span class="dot-legend"><i class="dot dot-reading"></i>在读</span>
          <span class="dot-legend"><i class="dot dot-done"></i>完成</span>
        </div>
        <button class="sidebar-changelog" id="sidebarChangelog" type="button">
          <span class="sc-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M12 7.5V12l3 1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.7"/></svg>
          </span>
          <span class="sc-label">更新日志</span>
          <span class="sc-ver" id="sidebarVersion">v1.0.0</span>
          <i class="vp-dot" id="sidebarVersionDot" hidden aria-hidden="true"></i>
        </button>
      </div>
    </aside>
    <div class="sidebar-scrim only-mobile" id="sidebarScrim"></div>

    <!-- 主内容区 -->
    <main class="main" id="main">
      <div class="main-inner" id="viewRoot" aria-live="polite"></div>
    </main>

    <!-- 右侧文章目录 -->
    <aside class="toc" id="toc" aria-label="本篇目录">
      <div class="toc-inner" id="tocInner"></div>
    </aside>
  </div>

  <!-- 搜索面板 -->
  <div class="overlay" id="searchOverlay" hidden>
    <div class="overlay-backdrop" data-close="search"></div>
    <div class="palette" role="dialog" aria-modal="true" aria-label="搜索">
      <div class="palette-head">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="搜索章节、概念、代码关键词…" autocomplete="off" spellcheck="false" />
        <kbd class="search-esc">Esc</kbd>
      </div>
      <div class="palette-filters" id="searchFilters"></div>
      <div class="palette-body" id="searchResults"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <!-- 笔记 / 书签抽屉 -->
  <div class="overlay" id="notesOverlay" hidden>
    <div class="overlay-backdrop" data-close="notes"></div>
    <div class="drawer" role="dialog" aria-modal="true" aria-label="我的笔记与书签">
      <div class="drawer-head">
        <div class="drawer-tabs" id="notesTabs">
          <button class="drawer-tab is-active" data-tab="notes">笔记 <em id="tabCountNotes">0</em></button>
          <button class="drawer-tab" data-tab="bookmarks">书签 <em id="tabCountMarks">0</em></button>
          <button class="drawer-tab" data-tab="progress">进度</button>
        </div>
        <button class="icon-btn" data-close="notes" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <!-- 阅读设置面板 -->
  <div class="reader-panel" id="readerPanel" hidden role="dialog" aria-label="阅读设置">
    <div class="rp-head">
      <span>阅读设置</span>
      <button class="icon-btn" data-reader-close aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="rp-body" id="readerBody"></div>
    <div class="rp-foot"><button class="btn btn-sm btn-ghost" data-reader-reset type="button">恢复默认</button></div>
  </div>
  <div class="reader-scrim" id="readerScrim" hidden></div>

  <!-- 更新日志 -->
  <div class="overlay" id="changelogOverlay" hidden>
    <div class="overlay-backdrop" data-close="changelog"></div>
    <div class="palette cl-modal" role="dialog" aria-modal="true" aria-label="更新日志">
      <div class="cl-head">
        <div class="cl-head-main">
          <div class="cl-kicker">更新日志</div>
          <div class="cl-title"><b id="clCurrent">v1.0.0</b><span class="cl-sub" id="clSub"></span></div>
        </div>
        <button class="icon-btn" data-close="changelog" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="palette-body" id="changelogBody"></div>
      <div class="palette-foot">
        <span>版本记录维护在 <code>content/changelog.js</code></span>
        <span style="margin-left:auto"><kbd>Esc</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <!-- 选中文本浮动工具条 -->
  <div class="selection-bar" id="selectionBar" hidden>
    <button data-act="highlight" class="sel-btn sel-hl">标记重点</button>
    <button data-act="note" class="sel-btn">写笔记</button>
    <button data-act="copy" class="sel-btn">复制</button>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script src="content/changelog.js"></script>
  <script src="content/catalog.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
